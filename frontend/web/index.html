  <style id="splash-screen-style">
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0D1117;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0D1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #splash-container.fade-out {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .splash-logo-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Orangish loading animation ring around the circular plate */
    .splash-spinner-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3.5px solid rgba(255, 107, 0, 0.12);
      border-top-color: #FF6B00;
      border-right-color: #FF8533;
      box-shadow: 0 0 20px rgba(255, 107, 0, 0.35);
      animation: platelySpin 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .splash-spinner-pulse {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 107, 0, 0.18) 0%, rgba(255, 107, 0, 0) 70%);
      animation: platelyPulse 2s ease-in-out infinite;
    }

    @keyframes platelySpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes platelyPulse {
      0%, 100% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .splash-logo-img {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 2;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const container = document.getElementById("splash-container");
      if (container) {
        container.classList.add("fade-out");
        setTimeout(() => container.remove(), 550);
      }
    }
    window.addEventListener('flutter-first-frame', function() {
      removeSplashFromWeb();
    });
  </script>
